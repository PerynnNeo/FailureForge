[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "failureforge"
version = "0.1.0"
description = "A reproducible robot-policy failure investigation workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12", "pydantic==2.11.7", "uvicorn==0.34.3",
  "numpy==2.2.6", "scipy==1.15.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.0", "httpx==0.28.1", "hypothesis==6.135.9"]

[project.scripts]
failureforge = "failureforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: requires the pinned robotics runtime, downloaded assets and a CUDA GPU"]

